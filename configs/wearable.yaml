# How the labels typed during a wearable recording session are used (scripts/finetune.py).
# Protocol: docs/wearable-recording.md. Decided 2026-11-23 (docs/decisions.md).
#
# known       label typed at the recorder -> model class (the RecoFit activity name)
# background  movements the taught models are fine-tuned to be uncertain on
# unknown     movements never used for training: the test of "does it say unknown?"
# shifted     a known exercise with the kit worn differently (test only) -> its class
known:
  curl: "Two-arm Dumbbell Curl (both arms, not alternating)"
  shoulder_press: "Shoulder Press (dumbbell)"
  lateral_raise: "Lateral Raise"
  jumping_jacks: "Jumping Jacks"
background: [standing_still, walking, arm_circles, shadow_boxing]
unknown: [waving, torso_twists]
shifted:
  curl_rotated90: "Two-arm Dumbbell Curl (both arms, not alternating)"
  curl_loose: "Two-arm Dumbbell Curl (both arms, not alternating)"

# The recording page's checklist (web/record.html), in the order it is recorded. `sets` is how
# many are needed, `seconds` the length of a fixed-length set. Fine-tuning needs two sets of
# every known and background label: the last set of each is held out for validation.
protocol:
  - {label: curl, sets: 3, seconds: 35, hint: "two-arm dumbbell curl, both arms together"}
  - {label: shoulder_press, sets: 3, seconds: 35, hint: "dumbbell shoulder press"}
  - {label: lateral_raise, sets: 3, seconds: 35, hint: "dumbbell lateral raise"}
  - {label: jumping_jacks, sets: 3, seconds: 35, hint: "jumping jacks"}
  - {label: standing_still, sets: 2, seconds: 45, hint: "stand, arms at your sides"}
  - {label: walking, sets: 2, seconds: 45, hint: "walk around the room"}
  - {label: arm_circles, sets: 2, seconds: 30, hint: "large circles with straight arms"}
  - {label: shadow_boxing, sets: 2, seconds: 30, hint: "punches in the air"}
  - {label: waving, sets: 2, seconds: 30, hint: "wave with the kit arm (test only)"}
  - {label: torso_twists, sets: 2, seconds: 30, hint: "twist the upper body left and right (test only)"}
  - {label: curl_rotated90, sets: 1, seconds: 30, hint: "curl with the case turned 90 degrees on the wrist"}
  - {label: curl_loose, sets: 1, seconds: 30, hint: "curl with a loose strap"}
