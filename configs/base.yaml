# Defaults shared by every experiment (development-spec §5). Method files override what differs;
# the command line overrides both with --set key.path=value. The resolved result is saved per run.
dataset: recofit
protocol: p1
method: softmax
data: {window_s: 2.0, hop_s: 1.0, purity: 0.8, channels: [ax, ay, az, gx, gy, gz], augment: false}
split: {n_folds: 5, val_frac: 0.15, frac_unknown: 0.25, min_subjects: 20, min_minutes: 5.0}
train: {epochs: 60, batch_size: 256, lr: 1.0e-3, weight_decay: 1.0e-4, patience: 8, class_weighting: inv_sqrt, num_workers: 0}
model: {dropout: 0.3}
eval: {accept_rate: 0.95}
