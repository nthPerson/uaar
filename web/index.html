<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UAAR live demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <section class="upload" aria-labelledby="h-upload">
    <div class="upload-row">
      <h1 id="h-upload"><span class="step">1</span>Upload</h1>
      <div class="flow" id="flow" aria-live="polite">
        <span class="node" id="source-node">No data source yet</span>
        <span class="pipe" aria-hidden="true"></span>
        <span class="node node-app">This app</span>
      </div>
      <dl class="stats">
        <div><dt>samples per second</dt><dd id="st-rate">0</dd></div>
        <div><dt>samples uploaded</dt><dd id="st-count">0</dd></div>
        <div><dt>lost</dt><dd id="st-lost">0</dd></div>
      </dl>
      <div class="actions">
        <button id="btn-connect" class="primary">Connect wearable</button>
        <label class="button" for="file-input">Upload a recording</label>
        <input id="file-input" type="file" accept=".csv,text/csv" hidden>
      </div>
    </div>
    <div class="trace">
      <canvas id="trace" aria-label="Accelerometer signal, last 10 seconds"></canvas>
      <span class="trace-caption">Accelerometer, last 10 seconds</span>
    </div>
  </section>

  <section class="predict" aria-labelledby="h-predict">
    <h1 id="h-predict"><span class="step">2</span>Prediction and uncertainty</h1>
    <div class="cards" id="cards">
      <p class="empty" id="cards-empty">Connecting to the prediction server.</p>
    </div>
  </section>

  <footer class="legend">
    <ul id="legend-classes"></ul>
    <p>A model answers <strong>unknown</strong> when its uncertainty is over its limit, the mark on the bar.</p>
  </footer>

  <script type="module" src="demo.js"></script>
</body>
</html>
