; UAAR wearable firmware: Seeed XIAO ESP32-S3 + GY-BMI160, a 50 Hz IMU streamer.
; Build:   uv tool run platformio run -d firmware
; Flash:   uv tool run platformio run -d firmware -t upload --upload-port /dev/ttyACM0
; Monitor: uv tool run platformio device monitor -d firmware -p /dev/ttyACM0
[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = default
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUAAR_FW_VERSION=\"0.1.0\"
  -Wall
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
